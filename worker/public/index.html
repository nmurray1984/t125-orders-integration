<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Troop 125 Campout Roster</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>

<section id="login" class="gate" hidden>
  <form id="login-form" class="card">
    <h1>Troop 125 Roster</h1>
    <p class="muted">Enter the troop password to view campout registrations.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit" id="login-button">Sign in</button>
    <p id="login-error" class="error" role="alert" hidden></p>
  </form>
</section>

<main id="app" hidden>
  <header class="bar">
    <div>
      <p class="eyebrow" id="eyebrow"></p>
      <h1 id="campout-title">Campout Roster</h1>
      <p id="sync-note" class="muted"></p>
    </div>
    <button type="button" id="logout" class="ghost">Sign out</button>
  </header>

  <nav class="switcher">
    <label class="field">
      <span>Viewing</span>
      <select id="campout"></select>
    </label>
  </nav>

  <section class="totals" aria-labelledby="totals-heading">
    <h2 id="totals-heading" class="section-heading">Headcount by patrol</h2>
    <div class="totals-grid">
      <div class="hero">
        <p class="hero-value" id="hero-total">0</p>
        <p class="hero-label">Total signed up</p>
      </div>
      <ul class="tiles" id="patrol-tiles"></ul>
    </div>
  </section>

  <section aria-labelledby="roster-heading">
    <div class="roster-head">
      <h2 id="roster-heading" class="section-heading">Who's going</h2>
      <div class="controls">
        <label class="field grow">
          <span>Search</span>
          <input id="search" type="search" placeholder="Name, patrol, rank, phone…" autocomplete="off">
        </label>
        <label class="field">
          <span>Sort by</span>
          <select id="sort">
            <option value="name">Name (A–Z)</option>
            <option value="patrol">Patrol, then name</option>
            <option value="rank">Rank, then name</option>
            <option value="recent">Most recent signup</option>
          </select>
        </label>
        <div class="actions">
          <a id="export" class="button" href="/api/export.csv" download>Download CSV</a>
          <button type="button" id="print" class="ghost">Print</button>
        </div>
      </div>
    </div>

    <p id="summary" class="summary" aria-live="polite"></p>

    <div class="table-wrap">
      <table id="roster">
        <thead>
          <tr>
            <th scope="col">Name</th>
            <th scope="col">Rank</th>
            <th scope="col">Patrol</th>
            <th scope="col">Cell</th>
            <th scope="col">Emergency contact</th>
            <th scope="col">Emergency phone</th>
            <th scope="col">Travels w/ troop</th>
          </tr>
        </thead>
        <tbody id="roster-body"></tbody>
      </table>
    </div>

    <p id="empty" class="empty" hidden>No registrations match.</p>
  </section>
</main>

<script src="/app.js"></script>
</body>
</html>
