name: Square Sync

on:
  # Hourly except 1am-5am CST
  schedule:
    - cron: '0 0-5,12-23 * * *'

  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Python tests
        run: |
          python test_square_orders.py
          python test_d1_sync.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run Worker tests
        working-directory: worker
        run: node --test test/*.test.js

  sync:
    needs: test
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Square sync
        env:
          SQUARE_ACCESS_TOKEN: ${{ secrets.SQUARE_ACCESS_TOKEN }}
          SQUARE_LOCATION_ID: ${{ secrets.SQUARE_LOCATION_ID }}
          GOOGLE_SHEET_ID: ${{ vars.GOOGLE_SHEET_ID }}
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
          SHEET_NAME: ${{ vars.SHEET_NAME || 'Sheet1' }}
          WRITE_MODE: ${{ vars.WRITE_MODE || 'overwrite' }}
          SQUARE_FETCH_LIMIT: ${{ vars.SQUARE_FETCH_LIMIT || '50' }}
          D1_SYNC_URL: ${{ vars.D1_SYNC_URL }}
          D1_SYNC_TOKEN: ${{ secrets.D1_SYNC_TOKEN }}
          # 'both' writes to Sheets and D1. Switch to 'd1' once you have
          # stopped using the spreadsheet.
          OUTPUT_MODE: ${{ vars.OUTPUT_MODE || 'both' }}
        run: |
          python square_orders.py --output "$OUTPUT_MODE"

      - name: Report execution time
        if: always()
        run: echo "Sync completed at $(date)"
